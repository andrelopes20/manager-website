<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel de Dashboards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Tela de login (visível só quando não há sessão/token válido) -->
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="login__card" autocomplete="off">
      <h1>Entrar no painel</h1>
      <p class="muted">Use as credenciais de administrador ou um link de acesso temporário.</p>
      <p id="login-error" class="alert" role="alert" hidden></p>
      <label>Usuário <input id="login-user" required autocomplete="username"></label>
      <label>Senha <input id="login-pass" type="password" required autocomplete="current-password"></label>
      <button class="btn btn--primary" type="submit">Entrar</button>
    </form>
  </main>

  <!-- Aplicação (sidebar + conteúdo) -->
  <div id="app-view" class="shell" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar__brand">Painel</div>
      <nav id="nav" class="sidebar__nav" aria-label="Principal"></nav>
      <div class="sidebar__foot">
        <span id="role-badge" class="badge"></span>
        <button id="logout" class="btn btn--ghost">Sair</button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button id="menu-btn" class="btn btn--ghost menu-btn" aria-label="Abrir menu">Menu</button>
        <h2 id="view-title"></h2>
      </header>
      <section id="view" class="content"></section>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
